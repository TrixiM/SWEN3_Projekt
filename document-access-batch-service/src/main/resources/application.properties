spring.datasource.url=jdbc:postgresql://postgres:5432/documentdb
spring.datasource.username=batchuser
spring.datasource.password=batchpassword

spring.batch.job.enabled=true

spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-postgresql.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest